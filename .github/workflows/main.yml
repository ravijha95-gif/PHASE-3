name: Build PROJECT R APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source and pinned runtime
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned native toolchain and accept licenses
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -n "${ANDROID_HOME:-}" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools were not found on this runner."
            echo "ANDROID_HOME=${ANDROID_HOME:-unset} ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "ndk;24.0.8215888" "cmake;3.22.1"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Locate Android project
        shell: bash
        run: |
          if [ -f "project_r/settings.gradle.kts" ]; then
            echo "PROJECT_DIR=project_r" >> "$GITHUB_ENV"
          elif [ -f "settings.gradle.kts" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            echo "Could not find settings.gradle.kts at repository root or project_r/."
            find . -maxdepth 3 -name settings.gradle.kts -print
            exit 1
          fi

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          set -o pipefail
          gradle --no-daemon assembleDebug 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"

      - name: Surface Gradle failure details
        if: failure()
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/gradle-build.log"
          if [ -f "$LOG" ]; then
            DETAILS="$(tail -n 45 "$LOG" | sed 's/%/%25/g; s/\r/%0D/g' | awk '{ if (NR > 1) printf "%%0A"; printf "%s", $0 }')"
            echo "::error title=Gradle build failure details::$DETAILS"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PROJECT-R-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
